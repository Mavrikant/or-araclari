<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="OR Araçları logo">
  <!-- Scaled-up version of the header logo for favicon usage -->
  <line x1="24" y1="88" x2="64" y2="24" stroke="#142d54" stroke-width="6.4" stroke-linecap="round" />
  <line x1="24" y1="88" x2="104" y2="88" stroke="#142d54" stroke-width="6.4" stroke-linecap="round" />
  <line x1="64" y1="24" x2="104" y2="88" stroke="#142d54" stroke-width="6.4" stroke-linecap="round" />
  <line x1="64" y1="24" x2="64" y2="88" stroke="#142d54" stroke-width="6.4" stroke-linecap="round" stroke-dasharray="8 8" />

  <circle cx="24" cy="88" r="12" fill="#142d54" />
  <circle cx="64" cy="24" r="12" fill="#142d54" />
  <circle cx="104" cy="88" r="12" fill="#142d54" />
  <circle cx="64" cy="88" r="10" fill="#142d54" opacity="0.6" />

  <style>
    /* Fallback for browsers that respect prefers-color-scheme inside SVG favicons */
    @media (prefers-color-scheme: dark) {
      line { stroke: #142d54 !important; }
      circle { fill: #142d54 !important; }
    }
  </style>
</svg>
